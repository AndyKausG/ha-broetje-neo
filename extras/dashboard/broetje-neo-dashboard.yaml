# Brötje NEO – Dashboard (Puffer + Mischerkreis 1 / Fußbodenheizung)
# Lizenz: MIT (siehe LICENSE im Repo-Root)
#
# Ziel: Wandtablet quer (Ansicht "Abschnitte", 4 Spalten).
# Hauptfrage: Hat die Heizung schon eingeschaltet? Heizanforderung,
# Heizkreispumpe, Pufferladung und Verdichterlauf sind getrennt sichtbar.
#
# Einrichtung: Einstellungen -> Dashboards -> Dashboard hinzufügen ->
# "Neu von Grund auf" -> Bearbeiten -> Rohkonfigurationseditor -> Inhalt
# dieser Datei einfügen.
#
# Voraussetzungen (Details: docs/DASHBOARD.md)
#   HACS Frontend: apexcharts-card (RomRider), button-card (custom-cards)
#   Packages:      extras/packages/broetje_neo_dashboard.yaml  (wpd_*)
#                  extras/packages/broetje_neo_analytics.yaml  (wpa_*, Tages-Arbeitszahl)
#
# ============================================================================
# ENTITÄTEN-ZUORDNUNG
# Annahme: Gerätename "Brötje NEO", HA-Sprache Deutsch -> Präfix "brotje_neo_".
# Bei anderem Gerätenamen per Suchen/Ersetzen "brotje_neo_" anpassen.
#
#   Außentemperatur        sensor.brotje_neo_aussentemperatur         R10
#   WP-Vorlauf/-Rücklauf   sensor.brotje_neo_vorlauftemperatur/...    R12/R13 (= Pufferladung)
#   Puffer / Warmwasser    sensor.brotje_neo_puffertemperatur / ...   R14 / R11
#   MKR1 Vorlauf-SOLL      sensor.brotje_neo_mkr1_vorlaufsoll         R35 (Ist nicht lesbar)
#   Verdichterdrehzahl     sensor.brotje_neo_verdichterdrehzahl       R29
#   Heizanforderung        binary_sensor.brotje_neo_heizen            R41 = 20
#   Heizkreispumpe         binary_sensor.brotje_neo_heizkreispumpe    R23
#   Pufferladepumpe        binary_sensor.brotje_neo_pufferladepumpe   R24
#   Verdichter             binary_sensor.brotje_neo_verdichter        R25
#   Ventilator             binary_sensor.brotje_neo_ventilator        R37
#   Abtauen                binary_sensor.brotje_neo_abtauen           R27
#
# Nicht lieferbar (NEO-RKM): Mischer-Vorlauf/-Rücklauf Ist, Mischerpumpe,
# Mischerstellung, Heizkurve, Heizgrenze (-> input_number.wpd_heizgrenze).
# ============================================================================

title: Wärmepumpe
views:
  - title: Wärmepumpe
    path: waermepumpe
    icon: mdi:heat-pump
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: sensor.wpd_status
        show_name: false
        show_icon: true
        show_state: true
      - type: entity
        entity: sensor.brotje_neo_betriebsart_status
        show_name: false
      - type: entity
        entity: binary_sensor.brotje_neo_storung
        visibility:
          - condition: state
            entity: binary_sensor.brotje_neo_storung
            state: "on"
      - type: entity
        entity: binary_sensor.brotje_neo_evu_freigabe
        name: EVU-Sperre
        visibility:
          - condition: state
            entity: binary_sensor.brotje_neo_evu_freigabe
            state: "off"
      - type: entity
        entity: sensor.wpd_heizperiode_gestartet
        name: Heizperiode seit
        show_name: true
    sections:
      # ------------------------------------------------------------ Zustand
      - type: grid
        cards:
          - type: heading
            heading: Heizt sie schon?
            icon: mdi:radiator
          - type: tile
            entity: sensor.wpd_status
            name: Status
            grid_options: {columns: full}
          - type: tile
            entity: binary_sensor.brotje_neo_heizen
            name: Heizanforderung
            icon: mdi:radiator
            color: amber
          - type: tile
            entity: binary_sensor.brotje_neo_heizkreispumpe
            name: Heizkreispumpe
            color: red
          - type: tile
            entity: binary_sensor.brotje_neo_pufferladepumpe
            name: Puffer laden
            color: orange
          - type: tile
            entity: binary_sensor.wpd_verdichter_heizen
            name: Verdichter heizt
            icon: mdi:heat-pump
            color: red
          - type: tile
            entity: sensor.wpd_heizanforderung_zuletzt_gestartet
            name: Anforderung zuletzt
          - type: tile
            entity: sensor.wpd_verdichter_heizen_zuletzt_gestartet
            name: Verdichter zuletzt
          - type: tile
            entity: binary_sensor.brotje_neo_warmwasser
            name: WW-Anforderung
            color: orange
          - type: tile
            entity: binary_sensor.brotje_neo_abtauen
            name: Abtauen
            color: light-blue

      # ---------------------------------------------------------- Kernwerte
      - type: grid
        cards:
          - type: heading
            heading: Temperaturen
            icon: mdi:thermometer
          - type: tile
            entity: sensor.brotje_neo_aussentemperatur
            name: Außen
            color: blue
          - type: tile
            entity: sensor.brotje_neo_mkr1_vorlaufsoll
            name: FBH Vorlauf Soll
            color: deep-orange
          - type: tile
            entity: sensor.brotje_neo_vorlauftemperatur
            name: WP Vorlauf
            color: red
          - type: tile
            entity: sensor.brotje_neo_rucklauftemperatur
            name: WP Rücklauf
            color: indigo
          - type: tile
            entity: sensor.brotje_neo_puffertemperatur
            name: Puffer
            color: orange
          - type: tile
            entity: sensor.brotje_neo_warmwassertemperatur
            name: Warmwasser
            color: amber
          - type: tile
            entity: sensor.brotje_neo_rucklaufsolltemperatur
            name: Puffer Soll
            color: grey
          - type: tile
            entity: sensor.brotje_neo_verdichterdrehzahl
            name: Verdichter
            icon: mdi:speedometer
            color: red

      # ---------------------------------------------------------- Effizienz
      - type: grid
        cards:
          - type: heading
            heading: Effizienz
            icon: mdi:leaf
          - type: tile
            entity: sensor.brotje_neo_cop_berechnet
            name: COP live
            icon: mdi:gauge
            color: green
          - type: tile
            entity: sensor.wpa_arbeitszahl_heute
            name: Arbeitszahl heute
            icon: mdi:calendar-today
            color: green
          - type: tile
            entity: sensor.brotje_neo_arbeitszahl_30_tage
            name: Arbeitszahl 30 Tage
            icon: mdi:calendar-month
            color: green
          - type: tile
            entity: sensor.brotje_neo_arbeitszahl_heizen
            name: Arbeitszahl Heizen gesamt
            icon: mdi:sigma
            color: teal
          - type: tile
            entity: sensor.brotje_neo_elektrische_leistung
            name: Strom
            color: yellow
          - type: tile
            entity: sensor.brotje_neo_heizleistung
            name: Wärme
            color: deep-orange
          - type: tile
            entity: sensor.brotje_neo_verdichterstarts_24_h
            name: Starts 24 h
          - type: tile
            entity: sensor.brotje_neo_laufzeit_pro_start
            name: Laufzeit/Start
          - type: tile
            entity: sensor.brotje_neo_abtauungen_24_h
            name: Abtauungen 24 h
          - type: tile
            entity: sensor.brotje_neo_effizienz_check
            name: Effizienz-Check

      # --------------------------------------------------------- Laufzeiten
      - type: grid
        cards:
          - type: heading
            heading: Laufzeiten
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.wpd_heizanforderung_heute
            name: Anforderung heute
            color: amber
          - type: tile
            entity: sensor.wpd_verdichterlaufzeit_heizen_heute
            name: Verdichter Heizen heute
            color: red
          - type: tile
            entity: sensor.wpd_heizanforderung_gestern
            name: Anforderung gestern
            color: amber
          - type: tile
            entity: sensor.wpd_verdichterlaufzeit_heizen_gestern
            name: Verdichter Heizen gestern
            color: red
          - type: tile
            entity: sensor.wpd_heizanforderung_7_tage
            name: Anforderung 7 Tage
            color: amber
          - type: tile
            entity: sensor.wpd_verdichterlaufzeit_heizen_7_tage
            name: Verdichter Heizen 7 Tage
            color: red
          - type: tile
            entity: sensor.wpd_verdichterlaufzeit_heute
            name: Verdichter gesamt heute
          - type: tile
            entity: sensor.wpd_verdichterlaufzeit_7_tage
            name: Verdichter gesamt 7 Tage

      # ------------------------------------------------------------- Schema
      # Bewegung nur bei Aktivität: Leitungen fließen nur bei laufender Pumpe,
      # Lüfter dreht nur bei laufendem Ventilator (Tempo nach Verdichterdrehzahl),
      # Verdichter pulsiert nur bei Lauf. Abtauen: Pufferkreis fließt rückwärts.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Anlage
            icon: mdi:pipe
          - type: custom:button-card
            grid_options: {columns: full}
            show_name: false
            show_icon: false
            show_state: false
            tap_action: {action: none}
            triggers_update:
              - sensor.wpd_status
              - sensor.wpd_status_code
              - sensor.brotje_neo_aussentemperatur
              - sensor.brotje_neo_vorlauftemperatur
              - sensor.brotje_neo_rucklauftemperatur
              - sensor.brotje_neo_puffertemperatur
              - sensor.brotje_neo_warmwassertemperatur
              - sensor.brotje_neo_mkr1_vorlaufsoll
              - sensor.brotje_neo_verdichterdrehzahl
              - sensor.brotje_neo_elektrische_leistung
              - sensor.brotje_neo_heizleistung
              - sensor.brotje_neo_cop_berechnet
              - binary_sensor.brotje_neo_verdichter
              - binary_sensor.brotje_neo_ventilator
              - binary_sensor.brotje_neo_pufferladepumpe
              - binary_sensor.brotje_neo_heizkreispumpe
              - binary_sensor.brotje_neo_heizen
              - binary_sensor.brotje_neo_warmwasser
              - binary_sensor.brotje_neo_abtauen
            styles:
              card: [padding: 4px]
              grid: [grid-template-areas: '"schema"', grid-template-columns: 1fr]
              custom_fields:
                schema: [width: 100%]
            custom_fields:
              schema: |
                [[[
                  const st = (e) => (states[e] ? states[e].state : 'unavailable');
                  const on = (e) => st(e) === 'on';
                  const num = (e) => { const v = parseFloat(st(e)); return isNaN(v) ? null : v; };
                  const fmt = (v, u, d) => (v === null ? '–' : v.toFixed(d).replace('.', ',') + ' ' + u);
                  const tcol = (t) => {
                    if (t === null) return 'var(--disabled-text-color, #9e9e9e)';
                    const x = Math.max(0, Math.min(1, (t - 20) / 40));
                    return 'hsl(' + Math.round(220 - 220 * x) + ',75%,50%)';
                  };
                  const code = st('sensor.wpd_status_code');
                  const label = st('sensor.wpd_status');
                  const COL = {stoerung: '#db4437', evu_sperre: '#9c27b0', aus: '#757575',
                    abtauen: '#03a9f4', warmwasser: '#ff9800', heizen: '#e4572e',
                    kuehlen: '#2196f3', verdichter: '#e4572e', heizanforderung: '#ffb300',
                    ww_anforderung: '#ffb300', sommer: '#fbc02d'};
                  const scol = COL[code] || 'var(--secondary-text-color)';
                  const run = on('binary_sensor.brotje_neo_verdichter');
                  const fan = on('binary_sensor.brotje_neo_ventilator');
                  const defrost = code === 'abtauen';
                  const ww = run && on('binary_sensor.brotje_neo_warmwasser') && !defrost;
                  const buf = on('binary_sensor.brotje_neo_pufferladepumpe') && !ww;
                  const mkr = on('binary_sensor.brotje_neo_heizkreispumpe');
                  const speed = num('sensor.brotje_neo_verdichterdrehzahl') || 0;
                  const fanDur = speed > 0 ? Math.max(0.35, 2.2 - speed / 50) : 1.6;
                  const tA = num('sensor.brotje_neo_aussentemperatur');
                  const tVL = num('sensor.brotje_neo_vorlauftemperatur');
                  const tRL = num('sensor.brotje_neo_rucklauftemperatur');
                  const tP = num('sensor.brotje_neo_puffertemperatur');
                  const tW = num('sensor.brotje_neo_warmwassertemperatur');
                  const tM = num('sensor.brotje_neo_mkr1_vorlaufsoll');
                  const pel = num('sensor.brotje_neo_elektrische_leistung');
                  const pth = num('sensor.brotje_neo_heizleistung');
                  const cop = num('sensor.brotje_neo_cop_berechnet');
                  const HOT = '#e4572e', COLD = '#3b82f6', IDLE = 'var(--divider-color, #bdbdbd)';
                  const pipe = (d, col, active, rev) =>
                    '<path d="' + d + '" stroke="' + (active ? col : IDLE) + '" stroke-width="6" fill="none" stroke-linecap="round"' +
                    (active ? ' class="flow' + (rev ? ' rev' : '') + '"' : '') + '/>';
                  const pump = (x, y, active) =>
                    '<circle cx="' + x + '" cy="' + y + '" r="12" fill="var(--card-background-color)" stroke="' + (active ? HOT : IDLE) + '" stroke-width="3"/>' +
                    '<path d="M' + (x - 5) + ' ' + (y - 7) + ' L' + (x + 7) + ' ' + y + ' L' + (x - 5) + ' ' + (y + 7) + ' Z" fill="' + (active ? HOT : IDLE) + '"' + (active ? ' class="pulse"' : '') + '/>';
                  const tank = (x, y, w, h, t, name) =>
                    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="36" fill="' + tcol(t) + '" fill-opacity="0.25" stroke="' + tcol(t) + '" stroke-width="3"/>' +
                    '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 - 6) + '" class="lbl" text-anchor="middle">' + name + '</text>' +
                    '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 20) + '" class="val" text-anchor="middle">' + fmt(t, '°C', 1) + '</text>';
                  const hint = code === 'heizanforderung'
                    ? 'Anforderung aktiv, Puffer reicht noch (Verdichter aus)'
                    : (code === 'standby' || code === 'sommer' ? 'Keine Anforderung' : '');
                  return `
                  <svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:var(--paper-font-body1_-_font-family, sans-serif)">
                    <style>
                      .lbl { fill: var(--secondary-text-color); font-size: 15px; }
                      .val { fill: var(--primary-text-color); font-size: 22px; font-weight: 600; }
                      .big { font-size: 26px; font-weight: 700; }
                      .flow { stroke-dasharray: 12 10; animation: flow 1.1s linear infinite; }
                      .rev { animation-direction: reverse; }
                      .spin { transform-origin: 90px 215px; animation: spin ${fanDur}s linear infinite; }
                      .pulse { animation: pulse 1.4s ease-in-out infinite; }
                      @keyframes flow { to { stroke-dashoffset: -22; } }
                      @keyframes spin { to { transform: rotate(360deg); } }
                      @keyframes pulse { 50% { opacity: 0.35; } }
                    </style>

                    <text x="20" y="36" class="big" fill="${scol}">${label}</text>
                    <text x="20" y="60" class="lbl">${hint}</text>
                    <text x="800" y="36" class="lbl" text-anchor="end">COP ${fmt(cop, '', 2)}</text>
                    <text x="800" y="60" class="lbl" text-anchor="end">${fmt(pel, 'W', 0)} el. / ${fmt(pth, 'kW', 1)} th.</text>

                    <!-- Wärmepumpe -->
                    <rect x="20" y="100" width="190" height="270" rx="14" fill="none" stroke="${run ? scol : IDLE}" stroke-width="3"/>
                    <circle cx="90" cy="215" r="52" fill="none" stroke="${fan ? COLD : IDLE}" stroke-width="3"/>
                    <g class="${fan ? 'spin' : ''}" fill="${fan ? COLD : IDLE}">
                      <path d="M90 215 C80 185 88 170 102 168 C104 188 98 200 90 215 Z"/>
                      <path d="M90 215 C120 205 135 213 137 227 C117 229 105 223 90 215 Z"/>
                      <path d="M90 215 C70 238 54 238 46 226 C62 214 76 212 90 215 Z"/>
                    </g>
                    <circle cx="90" cy="215" r="6" fill="var(--primary-text-color)"/>
                    <circle cx="160" cy="320" r="22" fill="${run ? scol : 'none'}" fill-opacity="0.25" stroke="${run ? scol : IDLE}" stroke-width="3" class="${run ? 'pulse' : ''}"/>
                    <text x="160" y="326" class="lbl" text-anchor="middle">V</text>
                    <text x="40" y="300" class="lbl">Verdichter</text>
                    <text x="40" y="326" class="val">${fmt(speed, '%', 0)}</text>
                    <text x="40" y="130" class="lbl">Außen</text>
                    <text x="200" y="130" class="val" text-anchor="end">${fmt(tA, '°C', 1)}</text>
                    ${defrost ? '<text x="90" y="290" class="lbl" text-anchor="middle" fill="#03a9f4">❄ Abtauen</text>' : ''}

                    <!-- Pufferkreis (Pufferladepumpe) -->
                    ${pipe('M210 140 H360', HOT, buf || defrost, defrost)}
                    ${pipe('M360 200 H210', COLD, buf || defrost, defrost)}
                    ${pump(290, 200, buf || defrost)}
                    <text x="285" y="128" class="lbl" text-anchor="middle">${fmt(tVL, '°C', 1)}</text>
                    <text x="285" y="232" class="lbl" text-anchor="middle">${fmt(tRL, '°C', 1)}</text>

                    <!-- Warmwasserkreis -->
                    ${pipe('M210 285 H360', HOT, ww, false)}
                    ${pipe('M360 345 H210', COLD, ww, false)}

                    ${tank(360, 90, 100, 150, tP, 'Puffer')}
                    ${tank(360, 260, 100, 120, tW, 'Warmwasser')}

                    <!-- Mischerkreis 1 / Fußbodenheizung -->
                    ${pipe('M460 125 H660', HOT, mkr, false)}
                    ${pipe('M660 205 H460', COLD, mkr, false)}
                    <path d="M540 113 L564 125 L540 137 Z M588 113 L564 125 L588 137 Z" fill="none" stroke="${mkr ? HOT : IDLE}" stroke-width="3"/>
                    <path d="M564 125 V158" stroke="${mkr ? COLD : IDLE}" stroke-width="3" stroke-dasharray="4 4"/>
                    ${pump(620, 125, mkr)}
                    <text x="564" y="100" class="lbl" text-anchor="middle">MKR1</text>
                    <path d="M660 125 H790 V145 H680 V165 H790 V185 H680 V205 H660" fill="none" stroke="${mkr ? tcol(tM) : IDLE}" stroke-width="4" ${mkr ? 'class="flow"' : ''}/>
                    <text x="735" y="240" class="lbl" text-anchor="middle">Fußbodenheizung</text>
                    <text x="735" y="268" class="lbl" text-anchor="middle">Vorlauf Soll</text>
                    <text x="735" y="296" class="val" text-anchor="middle">${fmt(tM, '°C', 1)}</text>
                  </svg>`;
                ]]]

      # ------------------------------------------------- Übergangszeit 30 Tage
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Übergangszeit
            icon: mdi:chart-bar
          - type: custom:apexcharts-card
            grid_options: {columns: full}
            graph_span: 30d
            span:
              end: day
            header:
              show: true
              title: Laufzeit je Tag und Außentemperatur (30 Tage)
              show_states: false
            apex_config:
              chart: {height: 320}
              legend: {show: true}
              plotOptions:
                bar: {columnWidth: "75%"}
            yaxis:
              - id: h
                min: 0
                decimals: 1
                apex_config:
                  title: {text: "h/Tag"}
              - id: t
                opposite: true
                decimals: 0
                apex_config:
                  title: {text: "°C"}
            series:
              # Tagesmaximum der "heute"-Sensoren = Tagessumme (Langzeitstatistik)
              - entity: sensor.wpd_heizanforderung_heute
                name: Heizanforderung
                type: column
                yaxis_id: h
                color: "#ffb300"
                statistics: {type: max, period: day, align: start}
              - entity: sensor.wpd_verdichterlaufzeit_heizen_heute
                name: Verdichter Heizen
                type: column
                yaxis_id: h
                color: "#e4572e"
                statistics: {type: max, period: day, align: start}
              - entity: sensor.brotje_neo_aussentemperatur
                name: Außen Ø
                type: line
                yaxis_id: t
                color: "#3b82f6"
                stroke_width: 2
                statistics: {type: mean, period: day, align: start}
              - entity: input_number.wpd_heizgrenze
                name: Heizgrenze
                type: line
                yaxis_id: t
                color: "#9e9e9e"
                stroke_width: 1
                stroke_dash: 6
                show:
                  legend_value: false
                data_generator: |
                  const v = parseFloat(entity.state);
                  return isNaN(v) ? [] : [[start.getTime(), v], [end.getTime(), v]];

      # ------------------------------------------------------------ 24 h
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Letzte 24 Stunden
            icon: mdi:chart-line
          - type: custom:apexcharts-card
            grid_options: {columns: full}
            graph_span: 24h
            header:
              show: true
              title: Vorlauf, Puffer, Außen, Verdichter
              show_states: false
            apex_config:
              chart: {height: 320}
              legend: {show: true}
            yaxis:
              - id: t
                decimals: 0
                apex_config:
                  title: {text: "°C"}
              - id: p
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title: {text: "%"}
            series:
              - entity: binary_sensor.brotje_neo_heizen
                name: Heizanforderung
                type: area
                curve: stepline
                yaxis_id: p
                color: "#ffb300"
                opacity: 0.12
                stroke_width: 0
                transform: "return x === 'on' ? 100 : 0;"
              - entity: sensor.brotje_neo_verdichterdrehzahl
                name: Verdichter
                type: area
                yaxis_id: p
                color: "#e4572e"
                opacity: 0.2
                stroke_width: 1
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_vorlauftemperatur
                name: WP Vorlauf
                yaxis_id: t
                color: "#d32f2f"
                stroke_width: 2
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_mkr1_vorlaufsoll
                name: FBH Vorlauf Soll
                yaxis_id: t
                color: "#ff7043"
                curve: stepline
                stroke_width: 2
                stroke_dash: 5
              - entity: sensor.brotje_neo_puffertemperatur
                name: Puffer
                yaxis_id: t
                color: "#ff9800"
                stroke_width: 2
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_aussentemperatur
                name: Außen
                yaxis_id: t
                color: "#3b82f6"
                stroke_width: 2
                group_by: {func: avg, duration: 15min}

      # ---------------------------------------- Optional: PV-Anteil der WP
      # Nur mit konfiguriertem Analytics-Package (PV-Platzhalter ersetzt):
      # - type: grid
      #   cards:
      #     - type: heading
      #       heading: PV
      #     - type: tile
      #       entity: sensor.wpa_pv_uberschuss_fur_wp
      #     - type: tile
      #       entity: sensor.wpa_pv_leistung_in_wp
      #     - type: tile
      #       entity: sensor.wpa_pv_anteil_heute
