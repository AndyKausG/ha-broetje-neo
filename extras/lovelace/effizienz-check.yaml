# Effizienz-Check als Dashboard-Karte (Karte hinzufügen -> Manuell -> einfügen)
# Annahme: Gerätename "Brötje NEO", HA-Sprache Deutsch -> Präfix brotje_neo_
type: vertical-stack
cards:
  - type: markdown
    title: Effizienz-Check
    content: |
      {%- set s = 'sensor.brotje_neo_effizienz_check' -%}
      {%- set st = states(s) -%}
      {%- set label = {'collecting': '⏳ Sammle Daten (mind. 3 Tage)',
                       'good': '✅ Gut eingestellt',
                       'improvable': '💡 Verbesserbar',
                       'check': '⚠️ Bitte prüfen'} %}
      **Status:** {{ label.get(st, st) }}

      Datenbasis: {{ (state_attr(s, 'data_days') or 0) | round(1) }} Tage

      {% set rooms = state_attr(s, 'rooms') or [] -%}
      {% if rooms | count > 1 %}
      **Räume / Stockwerke (7 Tage):**
      {% for r in rooms %}
      - {{ r.name }}: {{ r.avg_7d }} °C{% if r.dev_7d is not none %} ({{ '%+.1f' | format(r.dev_7d) }} K zum Soll){% endif %}{% if r.name == state_attr(s, 'coldest_room') %} ❄️ kältester{% endif %}{% if (r.sensors or []) | count > 1 %} ({{ r.sensors | count }} Sensoren){% endif %}
      {%- endfor %}

      {% endif %}
      {% for h in state_attr(s, 'hints') or [] %}
      ***

      {{ '⚠️' if h.severity == 'warning' else '💡' }} **{{ h.title }}**

      *Befund:* {{ h.finding }}

      *Vorschlag:* {{ h.suggestion }}

      *Wer:* {{ h.who }}

      {% else %}
      Keine Hinweise.

      {% endfor %}
      ***

      <small>{{ state_attr(s, 'note') }}</small>
  - type: entities
    title: Kennzahlen
    entities:
      - entity: sensor.brotje_neo_arbeitszahl_30_tage
      - entity: sensor.brotje_neo_arbeitszahl_heizen_30_tage
      - entity: sensor.brotje_neo_arbeitszahl_warmwasser_30_tage
      - entity: sensor.brotje_neo_heizkurve_rl_soll_bei_18_grad
      - entity: sensor.brotje_neo_heizkurve_rl_soll_bei_0_grad
      - entity: sensor.brotje_neo_heizkurve_rl_soll_bei_minus_15_grad
      - entity: sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_18_grad
      - entity: sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_0_grad
      - entity: sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_minus_15_grad
      - entity: sensor.brotje_neo_raum_abweichung_vom_soll_7_tage
      - entity: sensor.brotje_neo_kaltester_raum_abweichung_7_tage
      - entity: sensor.brotje_neo_raum_unterschied_7_tage
      - entity: sensor.brotje_neo_spreizung_heizen_7_tage
      - entity: sensor.brotje_neo_raumtemperatur_7_tage
      - entity: sensor.brotje_neo_verdichterstarts_24_h
      - entity: sensor.brotje_neo_laufzeit_pro_start
      - entity: sensor.brotje_neo_abtauungen_24_h
