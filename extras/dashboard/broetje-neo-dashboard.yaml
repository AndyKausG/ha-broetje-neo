# Brötje NEO – Dashboard (Puffer + Mischerkreis 1 / Fußbodenheizung)
# Lizenz: MIT (siehe LICENSE im Repo-Root)
#
# Ziel: Wandtablet quer (Ansicht "Abschnitte", 4 Spalten).
# Hauptfrage: Hat die Heizung schon eingeschaltet? Heizanforderung,
# Heizkreispumpe, Pufferladung und Verdichterlauf sind getrennt sichtbar.
#
# Einrichtung: Diese Datei ist ein KOMPLETTES Dashboard, keine einzelne Karte.
# NICHT bei "Karte hinzufügen" / "Karte anpassen" einfügen (Fehler
# "No card type configured"), sondern:
# Einstellungen -> Dashboards -> Dashboard hinzufügen -> "Neu von Grund auf"
# -> Dashboard öffnen -> Stift (Bearbeiten) -> ⋮ -> Rohkonfigurationseditor
# -> gesamten Inhalt durch diese Datei ersetzen -> Speichern.
#
# Voraussetzungen (Details: docs/DASHBOARD.md)
#   Integration broetje_neo ab 0.6.0 (Status, Laufzeiten, Tageswerte, Heizgrenze)
#   HACS Frontend: apexcharts-card (RomRider), button-card (custom-cards)
#   Kein Package nötig.
#
# ============================================================================
# ENTITÄTEN-ZUORDNUNG
# Annahme: Gerätename "Brötje NEO", HA-Sprache Deutsch -> Präfix "brotje_neo_".
# Bei anderem Gerätenamen per Suchen/Ersetzen "brotje_neo_" anpassen.
#
#   Außentemperatur        sensor.brotje_neo_aussentemperatur         R10
#   WP-Vorlauf/-Rücklauf   sensor.brotje_neo_vorlauftemperatur/...    R12/R13 (= Pufferladung)
#   Puffer / Warmwasser    sensor.brotje_neo_puffertemperatur / ...   R14 / R11
#   MKR1 Vorlauf-SOLL      sensor.brotje_neo_mkr1_vorlaufsoll         R35 (Ist nicht lesbar)
#   Verdichterdrehzahl     sensor.brotje_neo_verdichterdrehzahl       R29
#   Heizanforderung        binary_sensor.brotje_neo_heizen            R41 = 20
#   Heizkreispumpe         binary_sensor.brotje_neo_heizkreispumpe    R23
#   Pufferladepumpe        binary_sensor.brotje_neo_pufferladepumpe   R24
#   Verdichter             binary_sensor.brotje_neo_verdichter        R25
#   Ventilator             binary_sensor.brotje_neo_ventilator        R37
#   Abtauen                binary_sensor.brotje_neo_abtauen           R27
#
# Nicht lieferbar (NEO-RKM): Mischer-Vorlauf/-Rücklauf Ist, Mischerpumpe,
# Mischerstellung, Heizkurve, Heizgrenze. Die Heizgrenze lernt der Effizienz-Check
# (sensor.brotje_neo_heizgrenze_beobachtet); optional Wert vom Bedienteil in den
# Optionen der Integration (sensor.brotje_neo_heizgrenze_eingestellt).
# ============================================================================

title: Wärmepumpe
views:
  - title: Wärmepumpe
    path: waermepumpe
    icon: mdi:heat-pump
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: sensor.brotje_neo_status
        show_name: false
        show_icon: true
        show_state: true
      - type: entity
        entity: sensor.brotje_neo_betriebsart_status
        show_name: false
      - type: entity
        entity: sensor.brotje_neo_mkr1_betriebsart_status
        name: FBH
        show_name: true
      - type: entity
        entity: binary_sensor.brotje_neo_storung
        visibility:
          - condition: state
            entity: binary_sensor.brotje_neo_storung
            state: "on"
      - type: entity
        entity: binary_sensor.brotje_neo_evu_freigabe
        name: EVU-Sperre
        visibility:
          - condition: state
            entity: binary_sensor.brotje_neo_evu_freigabe
            state: "off"
      - type: entity
        entity: sensor.brotje_neo_heizperiode_gestartet
        name: Heizperiode seit
        show_name: true
    sections:
      # ------------------------------------------------------------ Zustand
      - type: grid
        cards:
          - type: heading
            heading: Heizt sie schon?
            icon: mdi:radiator
          - type: tile
            entity: sensor.brotje_neo_status
            name: Status
            grid_options: {columns: full}
          - type: tile
            entity: binary_sensor.brotje_neo_heizen
            name: Heizanforderung
            icon: mdi:radiator
            color: amber
          - type: tile
            entity: binary_sensor.brotje_neo_heizkreispumpe
            name: Heizkreispumpe
            color: red
          - type: tile
            entity: binary_sensor.brotje_neo_pufferladepumpe
            name: Puffer laden
            color: orange
          - type: tile
            entity: binary_sensor.brotje_neo_verdichter_heizt
            name: Verdichter heizt
            icon: mdi:heat-pump
            color: red
          - type: tile
            entity: sensor.brotje_neo_heizanforderung_zuletzt_gestartet
            name: Anforderung zuletzt
          - type: tile
            entity: sensor.brotje_neo_verdichter_heizen_zuletzt_gestartet
            name: Verdichter zuletzt
          - type: tile
            entity: binary_sensor.brotje_neo_warmwasser
            name: WW-Anforderung
            color: orange
          - type: tile
            entity: binary_sensor.brotje_neo_abtauen
            name: Abtauen
            color: light-blue

      # ---------------------------------------------------------- Kernwerte
      - type: grid
        cards:
          - type: heading
            heading: Temperaturen
            icon: mdi:thermometer
          - type: tile
            entity: sensor.brotje_neo_aussentemperatur
            name: Außen
            color: blue
          - type: tile
            entity: sensor.brotje_neo_mkr1_vorlaufsoll
            name: FBH Vorlauf Soll
            color: deep-orange
          - type: tile
            entity: sensor.brotje_neo_vorlauftemperatur
            name: WP Vorlauf
            color: red
          - type: tile
            entity: sensor.brotje_neo_rucklauftemperatur
            name: WP Rücklauf
            color: indigo
          - type: tile
            entity: sensor.brotje_neo_puffertemperatur
            name: Puffer
            color: orange
          - type: tile
            entity: sensor.brotje_neo_warmwassertemperatur
            name: Warmwasser
            color: amber
          - type: tile
            entity: sensor.brotje_neo_rucklaufsolltemperatur
            name: Puffer Soll
            color: grey
          - type: tile
            entity: sensor.brotje_neo_verdichterdrehzahl
            name: Verdichter
            icon: mdi:speedometer
            color: red

      # ---------------------------------------------------------- Effizienz
      - type: grid
        cards:
          - type: heading
            heading: Effizienz
            icon: mdi:leaf
          - type: tile
            entity: sensor.brotje_neo_cop_berechnet
            name: COP live
            icon: mdi:gauge
            color: green
          - type: tile
            entity: sensor.brotje_neo_arbeitszahl_heute
            name: Arbeitszahl heute
            icon: mdi:calendar-today
            color: green
          - type: tile
            entity: sensor.brotje_neo_arbeitszahl_30_tage
            name: Arbeitszahl 30 Tage
            icon: mdi:calendar-month
            color: green
          - type: tile
            entity: sensor.brotje_neo_arbeitszahl_heizen
            name: Arbeitszahl Heizen gesamt
            icon: mdi:sigma
            color: teal
          - type: tile
            entity: sensor.brotje_neo_elektrische_leistung
            name: Strom
            color: yellow
          - type: tile
            entity: sensor.brotje_neo_heizleistung
            name: Wärme
            color: deep-orange
          - type: tile
            entity: sensor.brotje_neo_verdichterstarts_24_h
            name: Starts 24 h
          - type: tile
            entity: sensor.brotje_neo_laufzeit_pro_start
            name: Laufzeit/Start
          - type: tile
            entity: sensor.brotje_neo_abtauungen_24_h
            name: Abtauungen 24 h
          - type: tile
            entity: sensor.brotje_neo_effizienz_check
            name: Effizienz-Check
          - type: tile
            entity: sensor.brotje_neo_heizgrenze_beobachtet
            name: Heizgrenze (gelernt)
            color: grey

      # --------------------------------------------------------- Laufzeiten
      - type: grid
        cards:
          - type: heading
            heading: Laufzeiten
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.brotje_neo_heizanforderung_heute
            name: Anforderung heute
            color: amber
          - type: tile
            entity: sensor.brotje_neo_verdichterlaufzeit_heizen_heute
            name: Verdichter Heizen heute
            color: red
          - type: tile
            entity: sensor.brotje_neo_heizanforderung_gestern
            name: Anforderung gestern
            color: amber
          - type: tile
            entity: sensor.brotje_neo_verdichterlaufzeit_heizen_gestern
            name: Verdichter Heizen gestern
            color: red
          - type: tile
            entity: sensor.brotje_neo_heizanforderung_7_tage
            name: Anforderung 7 Tage
            color: amber
          - type: tile
            entity: sensor.brotje_neo_verdichterlaufzeit_heizen_7_tage
            name: Verdichter Heizen 7 Tage
            color: red
          - type: tile
            entity: sensor.brotje_neo_verdichterlaufzeit_heute
            name: Verdichter gesamt heute
          - type: tile
            entity: sensor.brotje_neo_verdichterlaufzeit_7_tage
            name: Verdichter gesamt 7 Tage

      # ------------------------------------------------------------- Schema
      # Bewegung nur bei Aktivität: Leitungen fließen nur bei laufender Pumpe,
      # Lüfter dreht nur bei laufendem Ventilator (Tempo nach Verdichterdrehzahl),
      # Kältekreis fließt und Verdichter pulsiert nur bei Lauf. Abtauen: Pufferkreis
      # fließt rückwärts. Klartextzeilen erklären den Zustand auch für Laien.
      # Heizkurve: gemessene Stützpunkte des Effizienz-Checks + aktueller Punkt.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Anlage
            icon: mdi:pipe
          - type: custom:button-card
            grid_options: {columns: full}
            show_name: false
            show_icon: false
            show_state: false
            tap_action: {action: none}
            triggers_update:
              - sensor.brotje_neo_status
              - binary_sensor.brotje_neo_heizkreispumpe
              - binary_sensor.brotje_neo_pufferladepumpe
              - binary_sensor.brotje_neo_ventilator
              - binary_sensor.brotje_neo_verdichter
              - binary_sensor.brotje_neo_warmwasser
              - sensor.brotje_neo_aussentemperatur
              - sensor.brotje_neo_cop_berechnet
              - sensor.brotje_neo_elektrische_leistung
              - sensor.brotje_neo_expansionsventil
              - sensor.brotje_neo_heizleistung
              - sensor.brotje_neo_hochdruck
              - sensor.brotje_neo_kondensationstemperatur
              - sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_0_grad
              - sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_18_grad
              - sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_minus_15_grad
              - sensor.brotje_neo_mkr1_betriebsart_status
              - sensor.brotje_neo_mkr1_vorlaufsoll
              - sensor.brotje_neo_niederdruck
              - sensor.brotje_neo_puffertemperatur
              - sensor.brotje_neo_rucklauftemperatur
              - sensor.brotje_neo_verdampfungstemperatur
              - sensor.brotje_neo_verdichterdrehzahl
              - sensor.brotje_neo_vorlauftemperatur
              - sensor.brotje_neo_warmwassertemperatur
            styles:
              card: [padding: 4px]
              grid: [grid-template-areas: '"schema"', grid-template-columns: 1fr]
              custom_fields:
                schema: [width: 100%]
            custom_fields:
              schema: |
                [[[
                  const st = (e) => (states[e] ? states[e].state : 'unavailable');
                  const on = (e) => st(e) === 'on';
                  const num = (e) => { const v = parseFloat(st(e)); return isNaN(v) ? null : v; };
                  const fmt = (v, u, d) => (v === null ? '–' : v.toFixed(d).replace('.', ',') + (u ? ' ' + u : ''));
                  const tcol = (t) => {
                    if (t === null) return 'var(--disabled-text-color, #9e9e9e)';
                    const x = Math.max(0, Math.min(1, (t - 20) / 40));
                    return 'hsl(' + Math.round(220 - 220 * x) + ',75%,50%)';
                  };
                  const code = st('sensor.brotje_neo_status');
                  const sObj = states['sensor.brotje_neo_status'];
                  const label = sObj ? hass.formatEntityState(sObj) : 'Status fehlt';
                  const COL = {fault: '#db4437', price_lock: '#9c27b0', utility_lock: '#9c27b0',
                    off: '#757575', defrost: '#03a9f4', hot_water: '#ff9800', heating: '#e4572e',
                    cooling: '#2196f3', compressor_running: '#e4572e', heating_demand: '#ffb300',
                    dhw_demand: '#ffb300', summer: '#fbc02d'};
                  const TXT = {
                    heating: 'Die Wärmepumpe holt Wärme aus der Außenluft und lädt den Heizpuffer.',
                    heating_demand: 'Das Haus braucht Wärme. Der Puffer ist noch warm genug, die Wärmepumpe wartet.',
                    hot_water: 'Die Wärmepumpe erwärmt gerade das Warmwasser.',
                    dhw_demand: 'Warmwasser wird angefordert. Die Wärmepumpe wartet noch (z. B. Mindestpause).',
                    defrost: 'Das Außengerät taut Eis ab und nutzt dafür kurz Wärme aus dem Puffer.',
                    cooling: 'Kühlbetrieb.',
                    compressor_running: 'Die Wärmepumpe läuft ohne Heiz- oder Warmwasseranforderung (z. B. PV-Überschuss).',
                    summer: 'Sommerbetrieb: keine Heizung, Warmwasser nur bei Bedarf.',
                    standby: 'Alles warm genug. Die Wärmepumpe ruht.',
                    price_lock: 'Preissperre: Die Wärmepumpe pausiert wegen hoher Strompreise.',
                    utility_lock: 'Der Netzbetreiber hat die Wärmepumpe vorübergehend gesperrt.',
                    off: 'Die Wärmepumpe ist ausgeschaltet.',
                    fault: 'Störung. Bitte Bedienteil prüfen oder Fachbetrieb anrufen.'};
                  const MODE = {off: 'Aus', auto: 'Automatik', cooling: 'Kühlen', summer: 'Sommer',
                    continuous: 'Dauerbetrieb', setback: 'Absenken', holiday: 'Urlaub', party: 'Party'};
                  const scol = COL[code] || 'var(--secondary-text-color)';
                  const run = on('binary_sensor.brotje_neo_verdichter');
                  const fan = on('binary_sensor.brotje_neo_ventilator');
                  const defrost = code === 'defrost';
                  const ww = run && on('binary_sensor.brotje_neo_warmwasser') && !defrost;
                  const buf = on('binary_sensor.brotje_neo_pufferladepumpe') && !ww;
                  const water = buf || ww || defrost;
                  const mkr = on('binary_sensor.brotje_neo_heizkreispumpe');
                  const speed = num('sensor.brotje_neo_verdichterdrehzahl');
                  const fanDur = speed ? Math.max(0.35, 2.2 - speed / 50) : 1.6;
                  const tA = num('sensor.brotje_neo_aussentemperatur');
                  const tVL = num('sensor.brotje_neo_vorlauftemperatur');
                  const tRL = num('sensor.brotje_neo_rucklauftemperatur');
                  const tP = num('sensor.brotje_neo_puffertemperatur');
                  const tW = num('sensor.brotje_neo_warmwassertemperatur');
                  const tM = num('sensor.brotje_neo_mkr1_vorlaufsoll');
                  const pel = num('sensor.brotje_neo_elektrische_leistung');
                  const pth = num('sensor.brotje_neo_heizleistung');
                  const cop = num('sensor.brotje_neo_cop_berechnet');
                  const pLow = num('sensor.brotje_neo_niederdruck');
                  const pHigh = num('sensor.brotje_neo_hochdruck');
                  const tEvap = num('sensor.brotje_neo_verdampfungstemperatur');
                  const tCond = num('sensor.brotje_neo_kondensationstemperatur');
                  const exv = num('sensor.brotje_neo_expansionsventil');
                  const mkrMode = MODE[st('sensor.brotje_neo_mkr1_betriebsart_status')] || '–';
                  const curve = [
                    [18, num('sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_18_grad')],
                    [0, num('sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_0_grad')],
                    [-15, num('sensor.brotje_neo_mischer_1_heizkurve_vl_soll_bei_minus_15_grad')]
                  ].filter((p) => p[1] !== null);
                  const HOT = '#e4572e', COLD = '#3b82f6', WARM = '#ff9800', IDLE = 'var(--divider-color, #bdbdbd)';
                  const pipe = (d, col, active, rev) =>
                    '<path d="' + d + '" stroke="' + (active ? col : IDLE) + '" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"' +
                    (active ? ' class="flow' + (rev ? ' rev' : '') + '"' : '') + '/>';
                  const pump = (x, y, active) =>
                    '<circle cx="' + x + '" cy="' + y + '" r="12" fill="var(--card-background-color, #fff)" stroke="' + (active ? HOT : IDLE) + '" stroke-width="3"/>' +
                    '<path d="M' + (x - 5) + ' ' + (y - 7) + ' L' + (x + 7) + ' ' + y + ' L' + (x - 5) + ' ' + (y + 7) + ' Z" fill="' + (active ? HOT : IDLE) + '"' + (active ? ' class="pulse"' : '') + '/>';
                  const tank = (x, y, w, h, t, name) =>
                    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="34" fill="' + tcol(t) + '" fill-opacity="0.25" stroke="' + tcol(t) + '" stroke-width="3"/>' +
                    '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 - 6) + '" class="lbl" text-anchor="middle">' + name + '</text>' +
                    '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 20) + '" class="val" text-anchor="middle">' + fmt(t, '°C', 1) + '</text>';
                  const arc = (x1, y1, x2, y2, col) =>
                    '<path d="M' + x1 + ' ' + y1 + ' A80 80 0 0 1 ' + x2 + ' ' + y2 + '" stroke="' + (run ? col : IDLE) + '" stroke-width="4" fill="none"' + (run ? ' class="flow"' : '') + '/>';
                  const X = (t) => 620 + Math.max(0, Math.min(1, (20 - t) / 35)) * 250;
                  const Y = (v) => 450 - Math.max(0, Math.min(1, (v - 20) / 30)) * 130;
                  const curvePath = curve.length >= 2
                    ? '<path d="' + curve.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ') + '" stroke="' + HOT + '" stroke-width="3" fill="none"/>'
                    : '<text x="745" y="336" class="sml" text-anchor="middle">Kurve: Effizienz-Check sammelt noch Daten</text>';
                  const point = tA !== null && tM !== null
                    ? '<circle cx="' + X(tA).toFixed(1) + '" cy="' + Y(tM).toFixed(1) + '" r="7" fill="' + scol + '" stroke="var(--primary-text-color)" stroke-width="2"/>'
                    : '';
                  const fbh = st('sensor.brotje_neo_mkr1_betriebsart_status') === 'summer'
                    ? 'Fußbodenheizung im Sommerbetrieb.'
                    : (mkr ? 'Die Fußbodenheizung wird aus dem Puffer versorgt (Vorlauf Soll ' + fmt(tM, '°C', 1) + ').'
                           : 'Die Pumpe der Fußbodenheizung steht.');
                  return `
                  <svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:var(--paper-font-body1_-_font-family, sans-serif)">
                    <style>
                      .lbl { fill: var(--secondary-text-color); font-size: 15px; }
                      .sml { fill: var(--secondary-text-color); font-size: 12.5px; }
                      .val { fill: var(--primary-text-color); font-size: 21px; font-weight: 600; }
                      .vs { fill: var(--primary-text-color); font-size: 14px; font-weight: 600; }
                      .txt { fill: var(--primary-text-color); font-size: 16px; }
                      .big { font-size: 26px; font-weight: 700; }
                      .flow { stroke-dasharray: 12 10; animation: flow 1.1s linear infinite; }
                      .rev { animation-direction: reverse; }
                      .spin { transform-origin: 70px 175px; animation: spin ${fanDur}s linear infinite; }
                      .pulse { animation: pulse 1.4s ease-in-out infinite; }
                      @keyframes flow { to { stroke-dashoffset: -22; } }
                      @keyframes spin { to { transform: rotate(360deg); } }
                      @keyframes pulse { 50% { opacity: 0.35; } }
                    </style>

                    <!-- Klartext -->
                    <text x="20" y="32" class="big" fill="${scol}">${label}</text>
                    <text x="20" y="58" class="txt">${sObj ? (TXT[code] || '') : 'Integration broetje_neo ab 0.6.0 nötig (docs/DASHBOARD.md).'}</text>
                    <text x="20" y="80" class="lbl">${fbh}</text>
                    <text x="880" y="28" class="lbl" text-anchor="end">COP ${fmt(cop, '', 2)}</text>
                    <text x="880" y="48" class="sml" text-anchor="end">${fmt(pel, 'W', 0)} Strom → ${fmt(pth, 'kW', 1)} Wärme</text>
                    <circle cx="770" cy="70" r="5" fill="${HOT}"/><text x="780" y="75" class="sml">warm</text>
                    <circle cx="830" cy="70" r="5" fill="${COLD}"/><text x="840" y="75" class="sml">kalt</text>

                    <!-- Wärmepumpe (Außengerät) mit Kältekreis -->
                    <rect x="20" y="100" width="310" height="355" rx="14" fill="none" stroke="${run ? scol : IDLE}" stroke-width="3"/>
                    <text x="34" y="124" class="lbl">Wärmepumpe</text>
                    <text x="316" y="124" class="lbl" text-anchor="end">außen ${fmt(tA, '°C', 1)}</text>
                    <circle cx="70" cy="175" r="34" fill="none" stroke="${fan ? COLD : IDLE}" stroke-width="3"/>
                    <g class="${fan ? 'spin' : ''}" fill="${fan ? COLD : IDLE}">
                      <path d="M70 175 C63 155 68 145 78 143 C80 157 76 165 70 175 Z"/>
                      <path d="M70 175 C90 168 101 174 102 184 C88 186 80 181 70 175 Z"/>
                      <path d="M70 175 C57 191 46 191 40 182 C51 174 61 172 70 175 Z"/>
                    </g>
                    <circle cx="70" cy="175" r="4" fill="var(--primary-text-color)"/>
                    <text x="70" y="226" class="sml" text-anchor="middle">Lüfter</text>

                    ${arc(120, 315, 200, 235, COLD)}
                    ${arc(200, 235, 280, 315, HOT)}
                    ${arc(280, 315, 200, 395, WARM)}
                    ${arc(200, 395, 120, 315, COLD)}
                    <circle cx="200" cy="235" r="14" fill="var(--card-background-color, #fff)" stroke="${run ? scol : IDLE}" stroke-width="3" class="${run ? 'pulse' : ''}"/>
                    <text x="200" y="240" class="sml" text-anchor="middle">V</text>
                    <text x="200" y="208" class="sml" text-anchor="middle">Verdichter <tspan class="vs">${fmt(speed, '%', 0)}</tspan></text>
                    <rect x="110" y="300" width="20" height="30" rx="3" fill="var(--card-background-color, #fff)" stroke="${run ? COLD : IDLE}" stroke-width="3"/>
                    <rect x="270" y="300" width="20" height="30" rx="3" fill="var(--card-background-color, #fff)" stroke="${run ? HOT : IDLE}" stroke-width="3"/>
                    <path d="M190 387 L210 403 L210 387 L190 403 Z" fill="var(--card-background-color, #fff)" stroke="${run ? WARM : IDLE}" stroke-width="3"/>
                    <text x="200" y="425" class="sml" text-anchor="middle">Expansionsventil <tspan class="vs">${fmt(exv, '%', 0)}</tspan></text>
                    <text x="163" y="290" class="sml" text-anchor="middle">Verdampfer</text>
                    <text x="163" y="310" class="vs" text-anchor="middle">${fmt(pLow, 'bar', 1)}</text>
                    <text x="163" y="328" class="vs" text-anchor="middle">${fmt(tEvap, '°C', 1)}</text>
                    <text x="237" y="290" class="sml" text-anchor="middle">Verflüssiger</text>
                    <text x="237" y="310" class="vs" text-anchor="middle">${fmt(pHigh, 'bar', 1)}</text>
                    <text x="237" y="328" class="vs" text-anchor="middle">${fmt(tCond, '°C', 1)}</text>
                    <text x="175" y="447" class="sml" text-anchor="middle">${run
                      ? 'Kältekreis: macht aus Luftwärme Heizwärme'
                      : 'Stillstand: Drücke gleichen sich aus'}</text>
                    ${defrost ? '<text x="70" y="250" class="sml" text-anchor="middle" fill="#03a9f4">❄ Abtauen</text>' : ''}

                    <!-- Wasserseite: Umschaltventil Puffer / Warmwasser -->
                    ${pipe('M290 300 H330 M330 300 H380', HOT, water, defrost)}
                    ${pipe('M420 345 H280 V330', COLD, water, defrost)}
                    ${pipe('M380 300 V150 H470', HOT, buf || defrost, defrost)}
                    ${pipe('M470 230 H420 V345', COLD, buf || defrost, defrost)}
                    ${pipe('M380 300 V330 H470', HOT, ww, false)}
                    ${pipe('M470 420 H420 V345', COLD, ww, false)}
                    <circle cx="380" cy="300" r="11" fill="var(--card-background-color, #fff)" stroke="${water ? HOT : IDLE}" stroke-width="3"/>
                    <path d="M380 300 L380 ${ww ? 312 : 288}" stroke="${water ? HOT : IDLE}" stroke-width="4" stroke-linecap="round"/>
                    <text x="388" y="190" class="sml">Ventil:</text>
                    <text x="388" y="206" class="sml">${ww ? 'Warmw.' : 'Puffer'}</text>
                    ${pump(445, 230, buf || defrost)}
                    <text x="352" y="288" class="sml" text-anchor="middle">${fmt(tVL, '°C', 1)}</text>
                    <text x="352" y="366" class="sml" text-anchor="middle">${fmt(tRL, '°C', 1)}</text>

                    ${tank(470, 100, 100, 160, tP, 'Puffer')}
                    ${tank(470, 285, 100, 165, tW, 'Warmwasser')}

                    <!-- Mischerkreis 1 / Fußbodenheizung -->
                    ${pipe('M570 130 H700', HOT, mkr, false)}
                    ${pipe('M700 230 H570', COLD, mkr, false)}
                    <path d="M600 118 L620 130 L600 142 Z M640 118 L620 130 L640 142 Z" fill="var(--card-background-color, #fff)" stroke="${mkr ? HOT : IDLE}" stroke-width="3"/>
                    <path d="M620 130 V230" stroke="${mkr ? COLD : IDLE}" stroke-width="2" stroke-dasharray="4 4"/>
                    ${pump(670, 130, mkr)}
                    <text x="588" y="106" class="sml">Mischer MKR1 · ${mkrMode}</text>
                    <path d="M700 130 H870 V155 H720 V180 H870 V205 H720 V230 H700" fill="none" stroke="${mkr ? tcol(tM) : IDLE}" stroke-width="4" ${mkr ? 'class="flow"' : ''}/>
                    <text x="785" y="254" class="sml" text-anchor="middle">Fußbodenheizung · Soll <tspan class="vs">${fmt(tM, '°C', 1)}</tspan></text>

                    <!-- Heizkurve MKR1 -->
                    <text x="620" y="290" class="lbl">Heizkurve MKR1 (gemessen)</text>
                    <path d="M620 320 V450 H870" stroke="var(--secondary-text-color)" stroke-width="1" fill="none"/>
                    <path d="M${X(0).toFixed(1)} 320 V450" stroke="${IDLE}" stroke-width="1" stroke-dasharray="3 4"/>
                    ${curvePath}
                    ${point}
                    <text x="616" y="324" class="sml" text-anchor="end">50</text>
                    <text x="616" y="452" class="sml" text-anchor="end">20</text>
                    <text x="620" y="466" class="sml">+20</text>
                    <text x="${X(0).toFixed(1)}" y="466" class="sml" text-anchor="middle">0</text>
                    <text x="870" y="466" class="sml" text-anchor="end">−15 °C außen</text>
                  </svg>`;
                ]]]

      # ------------------------------------------------- Übergangszeit 30 Tage
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Übergangszeit
            icon: mdi:chart-bar
          - type: custom:apexcharts-card
            grid_options: {columns: full}
            graph_span: 30d
            span:
              end: day
            header:
              show: true
              title: Laufzeit je Tag und Außentemperatur (30 Tage)
              show_states: false
            apex_config:
              chart: {height: 320}
              legend: {show: true}
              plotOptions:
                bar: {columnWidth: "75%"}
            yaxis:
              - id: h
                min: 0
                decimals: 1
                apex_config:
                  title: {text: "h/Tag"}
              - id: t
                opposite: true
                decimals: 0
                apex_config:
                  title: {text: "°C"}
            series:
              # Tageszuwachs der "heute"-Zähler = Tagessumme (Langzeitstatistik)
              - entity: sensor.brotje_neo_heizanforderung_heute
                name: Heizanforderung
                type: column
                yaxis_id: h
                color: "#ffb300"
                statistics: {type: change, period: day, align: start}
              - entity: sensor.brotje_neo_verdichterlaufzeit_heizen_heute
                name: Verdichter Heizen
                type: column
                yaxis_id: h
                color: "#e4572e"
                statistics: {type: change, period: day, align: start}
              - entity: sensor.brotje_neo_aussentemperatur
                name: Außen Ø
                type: line
                yaxis_id: t
                color: "#3b82f6"
                stroke_width: 2
                statistics: {type: mean, period: day, align: start}
              # gelernte Heizgrenze (Effizienz-Check), Tagesmittel aus der Statistik
              - entity: sensor.brotje_neo_heizgrenze_beobachtet
                name: Heizgrenze gelernt
                type: line
                curve: stepline
                yaxis_id: t
                color: "#616161"
                stroke_width: 2
                stroke_dash: 6
                statistics: {type: mean, period: day, align: start}
              # optional: Wert vom Bedienteil (Optionen der Integration)
              - entity: sensor.brotje_neo_heizgrenze_eingestellt
                name: Heizgrenze eingestellt
                type: line
                curve: stepline
                yaxis_id: t
                color: "#9e9e9e"
                stroke_width: 1
                stroke_dash: 3
                statistics: {type: mean, period: day, align: start}

      # ------------------------------------------------------------ 24 h
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Letzte 24 Stunden
            icon: mdi:chart-line
          - type: custom:apexcharts-card
            grid_options: {columns: full}
            graph_span: 24h
            header:
              show: true
              title: Vorlauf, Puffer, Außen, Verdichter
              show_states: false
            apex_config:
              chart: {height: 320}
              legend: {show: true}
            yaxis:
              - id: t
                decimals: 0
                apex_config:
                  title: {text: "°C"}
              - id: p
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title: {text: "%"}
            series:
              - entity: binary_sensor.brotje_neo_heizen
                name: Heizanforderung
                type: area
                curve: stepline
                yaxis_id: p
                color: "#ffb300"
                opacity: 0.12
                stroke_width: 0
                transform: "return x === 'on' ? 100 : 0;"
              - entity: sensor.brotje_neo_verdichterdrehzahl
                name: Verdichter
                type: area
                yaxis_id: p
                color: "#e4572e"
                opacity: 0.2
                stroke_width: 1
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_vorlauftemperatur
                name: WP Vorlauf
                yaxis_id: t
                color: "#d32f2f"
                stroke_width: 2
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_mkr1_vorlaufsoll
                name: FBH Vorlauf Soll
                yaxis_id: t
                color: "#ff7043"
                curve: stepline
                stroke_width: 2
                stroke_dash: 5
              - entity: sensor.brotje_neo_puffertemperatur
                name: Puffer
                yaxis_id: t
                color: "#ff9800"
                stroke_width: 2
                group_by: {func: avg, duration: 5min}
              - entity: sensor.brotje_neo_aussentemperatur
                name: Außen
                yaxis_id: t
                color: "#3b82f6"
                stroke_width: 2
                group_by: {func: avg, duration: 15min}

